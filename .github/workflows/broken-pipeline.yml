name: Broken Pipeline (Đã sửa)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Test Gradle & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # FIX 1 (Permission denied):
      # gradlew bị mất bit thực thi khi checkout trên runner Linux.
      # Phải cấp quyền +x trước khi gọi ./gradlew.
      - name: Cấp quyền thực thi cho Gradle wrapper
        run: chmod +x ./gradlew

      - name: Chạy kiểm thử Gradle và đóng gói JAR
        run: ./gradlew test bootJar --no-daemon

      # FIX 2 (Authentication failed):
      # Sai tên biến secret -> login ghcr.io trả 401 Unauthorized.
      # Tên đúng là REGISTRY_TOKEN.
      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # FIX 3 (Build context error):
      # Dockerfile nằm ở gốc repo nên phải dùng context: . và file: ./Dockerfile.
      - name: Đóng gói và đẩy Docker Image lên GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
